name: CI

on:
  push:
    branches: [main, master, "agent/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ai-mediator-backend/cloudrun/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ai-mediator-backend/cloudrun
      - run: npm run test:all
